name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FraganceSuite/Source_code/ProjectAroma

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, xml, zip

      - name: Copy .env
        run: cp .env.example .env

      - name: Set database environment variables
        run: |
          echo "DB_CONNECTION=mysql" >> .env
          echo "DB_HOST=66.29.141.150" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=aromuwjs_aroma" >> .env
          echo "DB_USERNAME=aromuwjs_aroma" >> .env
          echo "DB_PASSWORD=" >> .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run tests
        run: |
          php artisan test \
            tests/Feature/VideoTest.php \
            tests/Feature/DiscountPriceTest.php \
            tests/Feature/OrderHistoryTest.php \
            tests/Feature/BestSellerTest.php \
            tests/Feature/DashboardGraphsTest.php \
            tests/Feature/ProfileTest.php \
            tests/Feature/ReviewModerationTest.php \
            tests/Feature/Auth \
            tests/Unit/BestSellersLogicTest.php \
            tests/Unit/InfoCarouselTest.php \
            tests/Unit/VideoHelperTest.php \
            --stop-on-failure

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: tests
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/aromuwjs/devops.aromaperfumeria.shop
            git pull origin main
            cd Source_code/ProjectAroma
            composer install --no-interaction --prefer-dist --optimize-autoloader
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[AromaSuite] Pipeline PASSED - ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Pipeline completed successfully.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[AromaSuite] Pipeline FAILED - ${{ github.ref_name }}"
          to: ${{ secrets.MAIL_USERNAME }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Pipeline failed. Check the Actions tab for details.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
